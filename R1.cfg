! ============================================
! R1 Configuration
! ============================================
enable
configure terminal
!
hostname R1
!
no ip domain-lookup
!
interface Loopback0
 description LOOPBACK - EIGRP ADVERTISED
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description LINK TO R2
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface FastEthernet1/0
 description LINK TO R3
 ip address 10.0.13.1 255.255.255.252
 no shutdown
!
router eigrp 100
 network 0.0.0.0 255.255.255.255
 no auto-summary
 passive-interface Loopback0
 eigrp router-id 1.1.1.1
!
! --- Task 4: Unequal-cost load balancing to 192.168.4.0/24 ---
! R1 has two paths to 192.168.4.0/24:
!   Path A: R1 -> R2 (Gig0/0, 1Gbps)  -> R4
!   Path B: R1 -> R3 (Fa1/0, 100Mbps) -> R4
! Because the interface bandwidths differ, these paths have unequal
! EIGRP metrics. The "variance" command tells EIGRP to install any
! feasible successor route whose metric is within N times the best
! metric into the routing table (multiplied load balancing).
!
! Check the actual metrics first:
!   show ip eigrp topology
!
! Then set the multiplier so the higher-cost path qualifies.
! 128 is the maximum allowed value and guarantees both feasible
! successors are installed; tighten this once you've verified the
! real metric ratio with "show ip eigrp topology".
router eigrp 100
 variance 128
!
end
write memory
